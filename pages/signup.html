<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your ClassIQ account.">
  <title>Sign Up | ClassIQ</title>

  <script>
    if (localStorage.getItem("classiq_session")) window.location.replace("courses.html");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="auth-page">
  <a class="visually-hidden-focusable" href="#main">Skip to main content</a>

  <header class="site-header">
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="../index.html" aria-label="ClassIQ home">
          <img src="../assets/images/logo.png" alt="ClassIQ" class="brand-logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
          aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
          </ul>
          <div class="nav-actions">
            <a href="login.html" class="btn-dark-custom">Login</a>
            <a href="signup.html" class="btn-dark-custom" aria-current="page">SignUp</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="auth-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
          <section class="auth-card" aria-labelledby="signup-title">
            <h1 class="auth-title" id="signup-title">SignUp</h1>

            <form class="auth-form" id="signupForm" novalidate>
              <label for="signupEmail" class="visually-hidden">Email</label>
              <input type="email" class="form-control" id="signupEmail" placeholder="Enter Your Email" autocomplete="email">
              <div class="invalid-feedback"></div>

              <label for="signupUsername" class="visually-hidden">Username</label>
              <input type="text" class="form-control" id="signupUsername" placeholder="Enter Your Username" autocomplete="username">
              <div class="invalid-feedback"></div>

              <label for="signupPassword" class="visually-hidden">Password</label>
              <input type="password" class="form-control" id="signupPassword" placeholder="Enter Your Password" autocomplete="new-password">
              <div class="invalid-feedback"></div>

              <button type="submit" class="btn-primary-custom">SignUp</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <footer class="auth-footer">
    <div class="container">
      <p>&copy; 2024 ClassIQ. All rights reserved.</p>
    </div>
  </footer>

  <div class="modal fade popup" id="popup" tabindex="-1" aria-labelledby="popupTitle" aria-hidden="true"
    data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <span class="popup-icon" id="popupIcon" aria-hidden="true"><i class="bi bi-check-lg"></i></span>
        <h2 class="popup-title" id="popupTitle"></h2>
        <p class="popup-message" id="popupMessage"></p>
        <button type="button" class="btn-primary-custom" id="popupButton"></button>
        <button type="button" class="popup-cancel" id="popupCancel" data-bs-dismiss="modal" hidden>Cancel</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
